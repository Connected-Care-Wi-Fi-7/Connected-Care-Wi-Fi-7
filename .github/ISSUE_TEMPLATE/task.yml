name: Issue
description: Report a bug, propose a feature, or describe a task, spike or docs change
body:
  - type: markdown
    attributes:
      value: |
        After you submit, the `type:`, `area:` and `priority:` labels are applied from your answers automatically, and the area lead is set as "Lead reviewer" on the project board. Check the labels and set a milestone.

        See CONTRIBUTING.md for what each label and milestone means.
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Bug
        - Feature
        - Task
        - Spike
        - Docs
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Platform
        - Sensing
        - DSP
        - Mapping
        - Dashboard
        - Alerts
        - Project
    validations:
      required: true
  - type: input
    id: requirement
    attributes:
      label: Requirement
      description: The requirement from SPECIFICATION.md this work supports, with its number and name, for example "FR-03 (spatial triggers)". Write "none" if there is no matching requirement.
      placeholder: FR-03 (spatial triggers)
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Must
        - Should
        - Could
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What needs to happen, in a few sentences.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this is needed, links to related issues, ADRs or documents.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist that tells the reviewer when this issue is finished.
      placeholder: |
        - [ ] First observable outcome
        - [ ] Second observable outcome
        - [ ] Tests added or updated
    validations:
      required: true
  - type: dropdown
    id: hardware
    attributes:
      label: Hardware dependency
      options:
        - No hardware
        - Simulator only
        - Needs hardware
    validations:
      required: true
  - type: textarea
    id: bug-details
    attributes:
      label: Bug details
      description: Bugs only. Include steps to reproduce, expected behaviour, actual behaviour and environment (operating system, Rust version, commit).
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Anything related that this issue deliberately does not cover.
