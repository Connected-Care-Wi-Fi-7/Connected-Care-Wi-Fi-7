name: Conventions

# Local hooks can be skipped with --no-verify, so CI checks what reaches main:
# the PR title becomes the squash commit subject.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The title goes through an environment variable, never straight into
      # the script, so a crafted title cannot inject shell commands.
      - name: Check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: .githooks/check-subject pr "$TITLE"

      - name: Test git hooks
        run: .githooks/test-hooks
