name: PR reviewer

# Copies the area: label from the issue a PR closes and requests a review from
# that area's lead (.github/area-leads.json). If the author is the lead, the
# Team Lead is requested instead. It also adds the PR to the project board and
# sets the board's "Lead reviewer" field to the same person.
#
# pull_request_target runs with the base branch's workflow and mapping file,
# so a PR cannot change who it gets routed to. PR code is never checked out.

on:
  pull_request_target:
    types: [opened, reopened, edited, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-reviewer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  route:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    env:
      HAS_PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/area-leads.json
          sparse-checkout-cone-mode: false

      - uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const { teamLead, areas } = JSON.parse(fs.readFileSync('.github/area-leads.json', 'utf8'));
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const MARKER = '<!-- pr-reviewer:no-linked-issue -->';

            const linked = [...(pr.body || '').matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)]
              .map((m) => Number(m[1]));

            if (linked.length === 0) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo, issue_number: pr.number,
              });
              if (!comments.some((c) => c.body.includes(MARKER))) {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: pr.number,
                  body: `${MARKER}\nThis PR does not link an issue. Add \`Closes #<issue number>\` to the description so the area lead is requested as reviewer. See CONTRIBUTING.md.`,
                });
              }
              return;
            }

            const areaLabels = new Set();
            for (const number of linked) {
              try {
                const { data } = await github.rest.issues.get({ ...context.repo, issue_number: number });
                if (data.pull_request) continue;
                data.labels.map((l) => l.name).filter((n) => n.startsWith('area:')).forEach((n) => areaLabels.add(n));
              } catch (e) {
                core.warning(`Could not read #${number}: ${e.message}`);
              }
            }

            if (areaLabels.size === 0) {
              core.info('Linked issues have no area: label; nothing to route.');
              return;
            }

            await github.rest.issues.addLabels({
              ...context.repo, issue_number: pr.number, labels: [...areaLabels],
            });

            const reviewers = new Set();
            for (const label of areaLabels) {
              const lead = areas[label.slice('area:'.length)];
              if (!lead) { core.warning(`No lead mapped for ${label}.`); continue; }
              const pick = lead.toLowerCase() === author.toLowerCase() ? teamLead : lead;
              if (pick.toLowerCase() !== author.toLowerCase()) reviewers.add(pick);
            }

            const already = new Set(pr.requested_reviewers.map((r) => r.login.toLowerCase()));
            const toRequest = [...reviewers].filter((r) => !already.has(r.toLowerCase()));
            if (toRequest.length === 0) return;

            core.info(`Requesting review from: ${toRequest.join(', ')}`);
            await github.rest.pulls.requestReviewers({
              ...context.repo, pull_number: pr.number, reviewers: toRequest,
            });

      # Writing to an organisation project needs a token with project access;
      # GITHUB_TOKEN cannot. Without the PROJECT_TOKEN secret this step is skipped.
      # Runs even when the step above returned early, and reads labels fresh, so
      # a PR whose reviewer was already requested by hand still reaches the board.
      - name: Add PR to the project board and set Lead reviewer
        if: env.HAS_PROJECT_TOKEN == 'true'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const fs = require('fs');
            const { teamLead, areas } = JSON.parse(fs.readFileSync('.github/area-leads.json', 'utf8'));
            const PROJECT_OWNER = context.repo.owner;
            const PROJECT_NUMBER = 2;
            const FIELD_NAME = 'Lead reviewer';
            const author = context.payload.pull_request.user.login;

            const { repository } = await github.graphql(
              `query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    id
                    labels(first: 50) { nodes { name } }
                  }
                }
              }`,
              { owner: context.repo.owner, repo: context.repo.repo, number: context.payload.pull_request.number },
            );
            const pr = repository.pullRequest;

            const { organization } = await github.graphql(
              `query($org: String!, $number: Int!, $field: String!) {
                organization(login: $org) {
                  projectV2(number: $number) {
                    id
                    field(name: $field) {
                      ... on ProjectV2SingleSelectField { id options { id name } }
                    }
                  }
                }
              }`,
              { org: PROJECT_OWNER, number: PROJECT_NUMBER, field: FIELD_NAME },
            );
            const project = organization.projectV2;

            // Returns the existing item if the PR is already on the board.
            const { addProjectV2ItemById } = await github.graphql(
              `mutation($project: ID!, $content: ID!) {
                addProjectV2ItemById(input: { projectId: $project, contentId: $content }) { item { id } }
              }`,
              { project: project.id, content: pr.id },
            );
            core.info('PR is on the project board.');

            const areaLabels = pr.labels.nodes.map((l) => l.name).filter((n) => n.startsWith('area:'));
            if (areaLabels.length !== 1) {
              core.info(`Expected exactly one area: label, found ${areaLabels.length}; not setting ${FIELD_NAME}.`);
              return;
            }
            const lead = areas[areaLabels[0].slice('area:'.length)];
            if (!lead) {
              core.warning(`No lead mapped for ${areaLabels[0]} in .github/area-leads.json.`);
              return;
            }
            // Same rule as the review request: the Team Lead reviews the lead's own PRs.
            const pick = lead.toLowerCase() === author.toLowerCase() ? teamLead : lead;
            if (pick.toLowerCase() === author.toLowerCase()) {
              core.info(`Author ${author} is both area lead and Team Lead; not setting ${FIELD_NAME}.`);
              return;
            }

            const option = project.field?.options.find((o) => o.name.toLowerCase() === pick.toLowerCase());
            if (!option) {
              core.warning(`Project field "${FIELD_NAME}" has no option "${pick}".`);
              return;
            }

            await github.graphql(
              `mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $project, itemId: $item, fieldId: $field,
                  value: { singleSelectOptionId: $option }
                }) { projectV2Item { id } }
              }`,
              { project: project.id, item: addProjectV2ItemById.item.id, field: project.field.id, option: option.id },
            );
            core.info(`${FIELD_NAME} set to ${option.name}.`);
