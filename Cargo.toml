[workspace]
resolver = "3"
members = ["apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
bevy = "0.20.1"

# Bevy is very slow unoptimised; optimise dependencies even in dev builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
