[workspace]
resolver = "3"
members = ["apps/viewer", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
bevy = "0.20.1"
# Clipboard and open-URL features are off: the viewer needs neither (zero-cloud).
bevy_egui = { version = "0.43.1", default-features = false, features = ["render", "default_fonts", "picking"] }
cc-core = { path = "crates/cc-core" }
thiserror = "2"
toml = "1.1"

# Bevy is very slow unoptimised; optimise dependencies even in dev builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
