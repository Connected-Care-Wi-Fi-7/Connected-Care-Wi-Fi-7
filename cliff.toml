# git-cliff configuration: builds CHANGELOG.md from the commits on main.
# Format: Keep a Changelog 1.1.0. Versions: Semantic Versioning 2.0.0.
# See "Releases" in CONTRIBUTING.md for when and how to run it.
# No [remote] section on purpose: git-cliff then works offline and never
# calls the GitHub API.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{% endfor -%}
{% endfor %}
"""
trim = false
# Turn "(#48)" into a link. GitHub redirects /pull/N to the issue when N is an issue.
postprocessors = [
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/Connected-Care-Wi-Fi-7/Connected-Care-Wi-Fi-7/pull/${1}))" },
]

[git]
conventional_commits = true
filter_unconventional = true
# Only user-visible changes go in the changelog. The HTML comments order the
# groups the way Keep a Changelog lists them and are stripped from the output.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^perf", group = "<!-- 1 -->Changed" },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
  { message = ".*", skip = true },
]
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
